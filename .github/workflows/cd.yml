name: Terraform CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  
concurrency:
  group: terraform-apply
  cancel-in-progress: false
  
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_tfstate_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_state_key: ${{ vars.TF_STATE_KEY }}
      TF_VAR_github_repo: "${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}"
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan
